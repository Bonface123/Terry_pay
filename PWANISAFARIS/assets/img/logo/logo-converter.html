<!DOCTYPE html>
<html>
<head>
    <title>Logo Converter</title>
</head>
<body>
    <canvas id="canvas" width="240" height="120" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <a id="download" download="pwanisafaris-logo.png">Download PNG</a>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Create a simple logo programmatically
        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 240, 120);
        
        // Wave background
        ctx.fillStyle = 'rgba(0, 119, 182, 0.1)';
        ctx.beginPath();
        ctx.arc(60, 60, 50, 0, 2 * Math.PI);
        ctx.fill();
        
        // Waves
        ctx.strokeStyle = '#0077B6';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(10, 70);
        ctx.quadraticCurveTo(30, 50, 50, 70);
        ctx.quadraticCurveTo(70, 90, 90, 70);
        ctx.stroke();
        
        ctx.lineWidth = 4;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(10, 80);
        ctx.quadraticCurveTo(30, 60, 50, 80);
        ctx.quadraticCurveTo(70, 100, 90, 80);
        ctx.stroke();
        ctx.globalAlpha = 1;
        
        // Palm tree trunk
        ctx.fillStyle = '#5C4033';
        ctx.fillRect(56, 40, 8, 40);
        
        // Palm fronds
        ctx.fillStyle = '#228B22';
        ctx.save();
        ctx.translate(50, 36);
        ctx.rotate(-Math.PI/9);
        ctx.fillRect(-16, -8, 32, 8);
        ctx.restore();
        
        ctx.save();
        ctx.translate(70, 36);
        ctx.rotate(Math.PI/9);
        ctx.fillRect(-16, -8, 32, 8);
        ctx.restore();
        
        ctx.fillRect(44, 30, 32, 8);
        
        // Sun
        ctx.fillStyle = '#F4E1C1';
        ctx.beginPath();
        ctx.arc(90, 30, 12, 0, 2 * Math.PI);
        ctx.fill();
        
        // Sun rays
        ctx.strokeStyle = '#F4E1C1';
        ctx.lineWidth = 4;
        for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4;
            const x1 = 90 + Math.cos(angle) * 18;
            const y1 = 30 + Math.sin(angle) * 18;
            const x2 = 90 + Math.cos(angle) * 25;
            const y2 = 30 + Math.sin(angle) * 25;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }
        
        // Text
        ctx.fillStyle = '#0077B6';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('PWANI', 130, 50);
        
        ctx.fillStyle = '#5C4033';
        ctx.fillText('SAFARIS', 130, 80);
        
        ctx.fillStyle = '#666';
        ctx.font = '16px Arial';
        ctx.fillText('Coastal Adventures', 130, 100);
        
        // Create download link
        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            document.getElementById('download').href = url;
        });
    </script>
</body>
</html>
